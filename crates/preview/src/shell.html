<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessel preview</title>
<style>
  :root {
    color-scheme: dark;
    --bar: #1b1b1b;
    --stage: #2a2a2a;
    --ink: #e6e6e6;
    --muted: #9a9a9a;
    --line: #3a3a3a;
    --accent: #2f7fd1;
    --bezel: #0d0d0d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--stage); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 10px;
    background: var(--bar); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30ch; }
  #size { color: var(--muted); font-variant-numeric: tabular-nums; }
  nav { display: flex; gap: 2px; margin-left: auto; }
  nav button { background: none; color: var(--ink); border: 1px solid transparent; border-radius: 5px;
    padding: 3px 9px; font: inherit; cursor: pointer; }
  nav button:hover { background: #2b2b2b; }
  nav button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  nav button small { color: inherit; opacity: 0.7; margin-left: 4px; font-variant-numeric: tabular-nums; }
  #reduce { background: none; color: var(--ink); border: 1px solid var(--line); border-radius: 5px;
    padding: 3px 9px; font: inherit; cursor: pointer; }
  #reduce[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { color: var(--muted); white-space: nowrap; }
  body.bare header { display: none; }
  #status.off { color: #ff8b7e; }
  main { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    position: relative; }
  main.full { align-items: flex-start; justify-content: flex-start; }
  #holder { flex: none; position: relative; }
  #device { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; }
  #device.phone { border: 12px solid var(--bezel); border-radius: 46px; overflow: hidden;
    box-shadow: 0 0 0 1px #444, 0 20px 60px rgba(0, 0, 0, 0.5); }
  #device.tablet { border: 14px solid var(--bezel); border-radius: 28px; overflow: hidden;
    box-shadow: 0 0 0 1px #444, 0 20px 60px rgba(0, 0, 0, 0.5); }
  #device.window { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); }
  iframe { display: block; border: 0; background: #fff; }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; padding: 24px; }
  #empty.on { display: flex; }
</style>
</head>
<body>
<header>
  <span id="title">Tessel preview</span>
  <span id="size"></span>
  <nav id="presets" aria-label="Viewport"></nav>
  <button id="reduce" type="button" aria-pressed="false" title="Preview as with reduced motion: no animations or transitions">Reduce motion</button>
  <span id="status">Connecting…</span>
</header>
<main id="stage">
  <div id="holder"><div id="device"><iframe id="page" title="Design preview"></iframe></div></div>
  <div id="empty">Nothing to preview yet.</div>
</main>
<script>
"use strict";
// Viewports (§13.2). `kind` picks the outline: a phone or tablet bezel, a
// window, or none (fit). Width null = the frame's own width.
const PRESETS = [
  { id: "phone", label: "Phone", w: 393, h: 852, kind: "phone" },
  { id: "tablet", label: "Tablet", w: 834, h: 1194, kind: "tablet" },
  { id: "desktop", label: "Desktop", w: 1440, h: null, kind: "window" },
  { id: "frame", label: "Frame width", w: null, h: null, kind: "window" },
  { id: "fit", label: "Fit window", w: null, h: null, kind: "fit" },
];
const $ = (id) => document.getElementById(id);
const stage = $("stage"), holder = $("holder"), device = $("device"), frame = $("page");
let state = { generation: 0 };
let shown = -1;
let preset = "frame";
try { preset = localStorage.getItem("tessel.preset") || preset; } catch (_) {}
const query = new URLSearchParams(location.search);
// `live=0`: no reload stream, for one-off captures (headless screenshots).
const live = query.get("live") !== "0";
const asked = query.get("preset");
if (asked) preset = asked;
// `chrome=0`: no header, outline or scaling: the page alone, top left.
const chrome = query.get("chrome") !== "0";
if (!chrome) document.body.classList.add("bare");
// `w` (and `h`): a viewport of that size.
const qw = Math.round(Number(query.get("w")) || 0), qh = Math.round(Number(query.get("h")) || 0);
if (qw > 0) {
  PRESETS.push({ id: "custom", label: "Custom", w: qw, h: qh > 0 ? qh : null, kind: "window" });
  preset = "custom";
}
// `scroll`: where the page starts, px.
let startY = Math.max(0, Number(query.get("scroll")) || 0);
// Reduced motion (§13.3): stop every animation and transition in the page.
let reduced = false;
try { reduced = localStorage.getItem("tessel.reduced") === "1"; } catch (_) {}
if (query.has("reduced")) reduced = query.get("reduced") === "1";
const REDUCED_CSS = "*, *::before, *::after { animation: none !important; transition: none !important; }";
function applyReduced() {
  $("reduce").setAttribute("aria-pressed", String(reduced));
  let doc;
  try { doc = frame.contentDocument; } catch (_) { return; }
  if (!doc || !doc.head) return;
  let el = doc.getElementById("tessel-reduced");
  if (reduced && !el) {
    el = doc.createElement("style");
    el.id = "tessel-reduced";
    el.textContent = REDUCED_CSS;
    doc.head.append(el);
  } else if (!reduced && el) {
    el.remove();
  }
}
$("reduce").addEventListener("click", () => {
  reduced = !reduced;
  try { localStorage.setItem("tessel.reduced", reduced ? "1" : "0"); } catch (_) {}
  applyReduced();
});
if (!PRESETS.some((p) => p.id === preset)) preset = "frame";

for (const p of PRESETS) {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.id = p.id;
  b.textContent = p.label;
  if (p.w) {
    const s = document.createElement("small");
    s.textContent = p.w;
    b.append(s);
  }
  b.addEventListener("click", () => {
    preset = p.id;
    try { localStorage.setItem("tessel.preset", preset); } catch (_) {}
    layout();
  });
  $("presets").append(b);
}

function layout() {
  const p = PRESETS.find((x) => x.id === preset);
  for (const b of $("presets").children) b.setAttribute("aria-pressed", String(b.dataset.id === preset));
  const frameW = Math.max(1, Math.round(state.width || 1440));
  const pad = p.kind === "fit" || !chrome ? 0 : 24;
  const border = !chrome ? 0 : p.kind === "phone" ? 12 : p.kind === "tablet" ? 14 : 0;
  const availW = Math.max(1, stage.clientWidth - 2 * pad);
  const availH = Math.max(1, stage.clientHeight - 2 * pad);
  let w, h, scale;
  if (p.kind === "fit") {
    w = availW; h = availH; scale = 1;
  } else if (!chrome) {
    w = p.w || frameW; h = p.h || availH; scale = 1;
  } else if (p.h) {
    // A device: fixed size, scaled down to fit.
    w = p.w; h = p.h;
    scale = Math.min(1, availW / (w + 2 * border), availH / (h + 2 * border));
  } else {
    // A window as wide as the preset or frame, as tall as fits.
    w = p.w || frameW;
    scale = Math.min(1, availW / w);
    h = Math.floor(availH / scale);
  }
  frame.style.width = w + "px";
  frame.style.height = h + "px";
  device.className = chrome ? p.kind : "";
  device.style.transform = `scale(${scale})`;
  holder.style.width = Math.round((w + 2 * border) * scale) + "px";
  holder.style.height = Math.round((h + 2 * border) * scale) + "px";
  stage.classList.toggle("full", p.kind === "fit" || !chrome);
  $("size").textContent = `${w} × ${h}` + (scale < 1 ? ` at ${Math.round(scale * 100)}%` : "");
}

async function reload() {
  let y = startY;
  try { if (shown >= 0) y = frame.contentWindow.scrollY || 0; } catch (_) {}
  try {
    const r = await fetch("state", { cache: "no-store" });
    state = await r.json();
  } catch (_) {
    return;
  }
  const has = state.generation > 0 && state.title !== undefined;
  $("empty").classList.toggle("on", !has);
  holder.style.visibility = has ? "visible" : "hidden";
  if (!has) return;
  $("title").textContent = state.title || "Untitled";
  document.title = `${state.title || "Untitled"} — Tessel preview`;
  layout();
  if (shown === state.generation) return;
  shown = state.generation;
  frame.onload = () => {
    applyReduced();
    try { frame.contentWindow.scrollTo({ left: 0, top: y, behavior: "instant" }); } catch (_) {}
  };
  frame.src = `page/index.html?g=${state.generation}`;
}

function connect() {
  const es = new EventSource("events");
  es.onopen = () => {
    $("status").textContent = "Live";
    $("status").classList.remove("off");
  };
  es.onmessage = (e) => {
    if (Number(e.data) !== shown) reload();
  };
  es.onerror = () => {
    $("status").textContent = "Disconnected: is Tessel still open?";
    $("status").classList.add("off");
  };
}

new ResizeObserver(layout).observe(stage);
layout();
reload();
if (live) connect(); else $("status").textContent = "";
</script>
</body>
</html>
