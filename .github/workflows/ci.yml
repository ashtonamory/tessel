name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # A fresh Arch (Omarchy) machine following the README quick start: only the
  # README packages, rustup, then scripts/install.sh, then a render on the
  # software Vulkan driver (lavapipe), as on a computer with no GPU.
  arch-install:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the README packages
        run: |
          pacman -Syu --noconfirm --needed git base-devel pkgconf wayland \
            libxkbcommon fontconfig libx11 libxcursor libxi libxrandr libxcb \
            vulkan-icd-loader xdg-desktop-portal xdg-desktop-portal-gtk \
            inter-font vulkan-swrast rustup desktop-file-utils shared-mime-info
      - uses: actions/checkout@v4
      - name: install.sh stops with a clear message when Rust is missing
        run: |
          if scripts/install.sh 2>err.txt; then exit 1; fi
          cat err.txt
          grep -q "cannot run\|not installed" err.txt
      - run: rustup default stable
      - name: scripts/install.sh
        run: scripts/install.sh
      - name: Smoke test the installed binary
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tessel --version
          tessel render crates/doc/tests/fixtures/spec_example.tessel.json -o out.png
          test -s out.png
          test -f "$HOME/.local/share/applications/tessel.desktop"
