[workspace]
resolver = "2"
members = ["crates/doc", "crates/layout", "crates/render", "crates/export", "crates/agent", "crates/app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
doc = { path = "crates/doc" }
layout = { path = "crates/layout" }
render = { path = "crates/render" }
export = { path = "crates/export" }
agent = { path = "crates/agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", features = ["log"] }
log = "0.4"
env_logger = "0.11"
taffy = "0.15.0"
parley = "0.12.0"
fontique = "0.12.0"
kurbo = "0.13.1"
peniko = "0.6.1"
vello = "0.11.0"
wgpu = "30.0.1"
pollster = "1.0.1"
eframe = "0.36.2"
egui = "0.36.2"
egui-wgpu = "0.36.2"
winit = "0.30"
rfd = "0.17"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tokio-util = "0.7"
schemars = "1.2.2"
base64 = "0.23"
